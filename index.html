<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Školní Trénink - Pohádková 3D Akademie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-gradient: radial-gradient(circle at center, #312e81 0%, #1e1b4b 100%);
            --text-color: #1e1b4b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Fredoka', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            padding: 30px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 4px 10px rgba(255,255,255,0.9);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 6px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #312e81;
            font-size: 34px;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.1);
        }

        .user-box {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            padding: 18px;
            border-radius: 25px;
            margin-bottom: 20px;
            border: 3px solid #cbd5e1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06), inset 0 3px 5px rgba(255,255,255,0.8);
        }

        input[type="text"] {
            width: 85%;
            padding: 14px;
            font-size: 18px;
            border: 3px solid #cbd5e1;
            border-radius: 18px;
            margin-top: 8px;
            text-align: center;
            font-weight: 600;
            outline: none;
            background: #f8fafc;
            color: #1e1b4b;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .btn {
            background: linear-gradient(145deg, #818cf8, #4f46e5);
            color: white;
            border: none;
            padding: 16px 22px;
            font-size: 19px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4), inset 0 3px 4px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.6);
        }

        .btn:active { transform: translateY(2px); }

        .btn-success { background: linear-gradient(145deg, #34d399, #059669); }
        .btn-danger { background: linear-gradient(145deg, #f87171, #dc2626); font-size: 16px; padding: 14px; }
        .btn-warning { background: linear-gradient(145deg, #fbbf24, #d97706); font-size: 16px; padding: 14px; color: #fff; }
        .btn-game { background: linear-gradient(145deg, #38bdf8, #0284c7); }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .btn-subject {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 3px solid #cbd5e1;
            color: #1e1b4b;
            font-size: 17px;
            border-radius: 25px;
            padding: 18px 12px;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }

        .btn-subject span { 
            font-size: 36px; 
            animation: floatIcon 3s ease-in-out infinite;
        }

        .btn-subject:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: linear-gradient(145deg, #e0f2fe, #bae6fd);
        }

        .hidden { display: none !important; }

        .option-btn {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 3px solid #cbd5e1;
            color: #1e1b4b;
            margin: 10px 0;
            font-size: 18px;
            border-radius: 20px;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: linear-gradient(145deg, #e0f2fe, #bae6fd);
        }

        .score-board {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 3px solid #cbd5e1;
            padding: 18px;
            border-radius: 28px;
            margin-top: 20px;
            text-align: left;
        }

        .score-board h4 {
            margin-top: 0;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 17px;
        }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 160px;
            overflow-y: auto;
        }

        .score-item {
            background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            border: 2px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
        }

        #feedback {
            font-size: 22px;
            font-weight: 700;
            margin-top: 12px;
            min-height: 35px;
        }

        .question-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            padding: 22px;
            border-radius: 25px;
            border: 3px solid #cbd5e1;
            margin-bottom: 15px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .memory-card {
            background: linear-gradient(145deg, #94a3b8, #64748b);
            height: 60px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
        }
        .memory-card.flipped {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            transform: scale(1.08);
            border: 3px solid #4f46e5;
        }
        .memory-card.matched {
            background: linear-gradient(145deg, #34d399, #059669);
            color: white;
        }

        #snake-canvas {
            background: radial-gradient(circle, #312e81 0%, #0f172a 100%);
            border: 6px solid #4f46e5;
            border-radius: 24px;
            display: block;
            margin: 15px auto;
        }
        .snake-controls {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .ctrl-btn {
            background: linear-gradient(145deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            font-size: 24px;
            height: 56px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        .modal-content {

            color: #1e1b4b;
            padding: 35px;
