<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Školní Trénink - Zábavné Učení</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --success: #2ECC71;
            --danger: #E74C3C;
            --accent: #F1C40F;
            --bg: #EEF2F7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 520px;
            text-align: center;
            border: 4px solid #ffffff;
        }

        h1 {
            color: #2C3E50;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .user-box {
            background: #E8F4F8;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px dashed #3498DB;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #BDC3C7;
            border-radius: 10px;
            margin-top: 8px;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: all 0.2s ease;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #27AE60; }

        .btn-subject {
            background: linear-gradient(45deg, #6C5CE7, #a29bfe);
            font-size: 17px;
        }

        .hidden { display: none !important; }

        .option-btn {
            background: #F8F9FA;
            border: 2px solid #E2E8F0;
            color: #2D3748;
            margin: 8px 0;
            font-size: 17px;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #EBF8FF;
        }

        .score-board {
            background: #FFF9E6;
            border: 2px solid #F39C12;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .score-board h4 {
            margin-top: 0;
            color: #D35400;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .score-item {
            background: #FFFFFF;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #F1C40F;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .badge-subject {
            background: #34495E;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .vertical-math {
            font-family: 'Courier New', Courier, monospace;
            font-size: 32px;
            font-weight: bold;
            text-align: right;
            display: inline-block;
            border-bottom: 4px solid #2C3E50;
            padding: 10px 20px;
            margin: 15px 0;
            background: #F4F6F7;
            border-radius: 8px;
            letter-spacing: 2px;
        }

        #feedback {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }

        .question-card {
            background: #F7FAFC;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HLAVNÍ MENU -->
    <div id="menu-screen">
        <h1>🌟 Školní Trénink 🌟</h1>
        <div class="user-box">
            <label for="username"><strong>👤 Napiš své jméno:</strong></label><br>
            <input type="text" id="username" placeholder="Tvoje jméno..." value="Školák">
        </div>

        <h3>🎯 Vyber si předmět:</h3>
        <button class="btn btn-subject" onclick="startQuiz('math')">🔢 Matematika (do 1000)</button>
        <button class="btn btn-subject" onclick="startQuiz('eng')">🇬🇧 Angličtina (6. třída)</button>
        <button class="btn btn-subject" onclick="startQuiz('cz')">🇨🇿 Čeština (i/y, e/ě, vyjm. slova)</button>
        <button class="btn btn-subject" onclick="startQuiz('phy')">⚡ Fyzika (6. třída)</button>

        <div class="score-board">
            <h4>🏆 Nejlepší výsledky s předmětem:</h4>
            <ul class="score-list" id="leaderboard"></ul>
        </div>
    </div>

    <!-- KVÍZOVÁ OBRAZOVKA -->
    <div id="quiz-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:16px;">
            <span id="question-count">📌 Otázka: 1/10</span>
            <span id="score-display" style="color: #27AE60;">⭐ Body: 0</span>
        </div>
        <hr style="border: 1px solid #E2E8F0; margin: 12px 0;">

        <div class="question-card">
            <h2 id="question-title" style="margin:0; color:#2C3E50; font-size:22px;">Otázka</h2>
