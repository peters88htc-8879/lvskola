<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angličtina 6. třída - Procvičování</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }
        .uk-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 6px solid #cf142b;
        }
        .btn-uk {
            background-color: #00247d;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-uk:hover {
            background-color: #001b5e;
            transform: translateY(-2px);
        }
        .btn-red {
            background-color: #cf142b;
            color: white;
        }
        .btn-red:hover {
            background-color: #b01023;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-lg uk-card rounded-2xl shadow-2xl p-6 relative overflow-hidden">
        
        <!-- Header Decor -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🇬🇧</span>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">English Practice</h1>
                    <p class="text-xs text-gray-500 font-semibold">6. TŘÍDA ZŠ</p>
                </div>
            </div>
            <div id="round-badge" class="bg-blue-100 text-blue-900 text-xs font-bold px-3 py-1.5 rounded-full hidden">
                Kolo <span id="round-num">1</span>
            </div>
        </div>

        <!-- SCREEN 1: Setup / Choice -->
        <div id="screen-setup" class="space-y-5">
            <div class="text-center my-4">
                <i class="fa-solid font-bold text-5xl text-blue-900 mb-2 fa-language"></i>
                <h2 class="text-lg font-bold text-gray-700">Vyber si směr překladu:</h2>
                <p class="text-xs text-gray-500">Každé kolo obsahuje 10 náhodných slovíček a vět</p>
            </div>

            <div class="space-y-3">
                <button onclick="startQuiz('mix')" class="w-full p-4 btn-uk rounded-xl font-bold text-left flex justify-between items-center shadow-md">
                    <span>🔀 Smíšený režim (CZ ↔ EN)</span>
                    <i class="fas font-bold fa-chevron-right"></i>
                </button>
                <button onclick="startQuiz('cz-en')" class="w-full p-4 bg-white border-2 border-blue-900 text-blue-900 hover:bg-blue-50 rounded-xl font-bold text-left flex justify-between items-center transition">
                    <span>🇨🇿 ➔ 🇬🇧 Z češtiny do angličtiny</span>
                    <i class="fas font-bold fa-chevron-right"></i>
                </button>
                <button onclick="startQuiz('en-cz')" class="w-full p-4 bg-white border-2 border-blue-900 text-blue-900 hover:bg-blue-50 rounded-xl font-bold text-left flex justify-between items-center transition">
                    <span>🇬🇧 ➔ 🇨🇿 Z angličtiny do češtiny</span>
                    <i class="fas font-bold fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- SCREEN 2: Quiz -->
        <div id="screen-quiz" class="hidden space-y-5">
            <!-- Progress Bar -->
            <div>
                <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
                    <span>Otázka <span id="q-curr">1</span> z 10</span>
                    <span id="q-mode-label" class="uppercase text-blue-700 font-extrabold"></span>
                </div>
                <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-red-600 h-full w-1/10 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Question Box -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-6 text-center my-4">
                <span class="text-xs uppercase font-bold text-blue-600 tracking-wider">Přelož:</span>
                <div id="question-text" class="text-2xl font-extrabold text-gray-800 mt-1">...</div>
            </div>

            <!-- Answer Input -->
            <form onsubmit="submitAnswer(event)" class="space-y-4">
                <div>
                    <input type="text" id="answer-input" placeholder="Napiš překlad..." autocomplete="off" autocorrect="off" spellcheck="false"
                        class="w-full p-4 border-2 border-gray-300 rounded-xl text-lg font-semibold focus:border-blue-700 focus:outline-none transition">
                </div>
                <button type="submit" class="w-full py-4 btn-red rounded-xl font-bold text-lg shadow-lg flex items-center justify-center space-x-2">
                    <span>Potvrdit odpověď</span>
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>

        <!-- SCREEN 3: Results -->
        <div id="screen-results" class="hidden space-y-5">
            <div class="text-center">
                <div id="grade-badge" class="w-20 h-20 mx-auto rounded-full bg-red-600 text-white flex items-center justify-center text-4xl font-extrabold shadow-lg mb-2">
                    1
                </div>
                <h2 id="result-title" class="text-xl font-bold text-gray-800">Skvělá práce!</h2>
                <p id="result-score" class="text-sm text-gray-600">Správně 10 z 10 otázek (100 %)</p>
            </div>

            <!-- Detail List -->
            <div class="max-h-56 overflow-y-auto space-y-2 border rounded-xl p-3 bg-gray-50" id="results-detail">
                <!-- Dynamic Content -->
            </div>

            <div class="space-y-2 pt-2">
                <button onclick="nextRound()" class="w-full py-3.5 btn-uk rounded-xl font-bold text-center shadow-md">
                    🔄 Další kolo (10 nových otázek)
                </button>
                <button onclick="showSetup()" class="w-full py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold text-center transition">
                    ⚙️ Změnit režim překladu
                </button>
            </div>
        </div>

    </div>

    <script>
        // Databáze učiva 6. třídy (slovíčka + věty)
        const vocabulary = [
            // Slovíčka
            { cz: "škola", en: "school" },
            { cz: "učitel", en: "teacher" },
            { cz: "přítel", en: "friend" },
            { cz: "kamarád", en: "friend" },
            { cz: "rodina", en: "family" },
            { cz: "domácí úkol", en: "homework" },
            { cz: "předmět", en: "subject" },
            { cz: "matematika", en: "maths" },
            { cz: "dějepis", en: "history" },
            { cz: "zeměpis", en: "geography" },
            { cz: "tělocvik", en: "pe" },
            { cz: "snídaně", en: "breakfast" },
            { cz: "oběd", en: "lunch" },
            { cz: "večeře", en: "dinner" },
            { cz: "pondělí", en: "monday" },
            { cz: "pátek", en: "friday" },
            { cz: "víkend", en: "weekend" },
            { cz: "vstávat", en: "get up" },
            { cz: "poslouchat hudbu", en: "listen to music" },
            { cz: "hrát fotbal", en: "play football" },
            { cz: "číst knihu", en: "read a book" },
            { cz: "pes", en: "dog" },
            { cz: "kočka", en: "cat" },
            { cz: "zahrada", en: "garden" },
            { cz: "kuchyň", en: "kitchen" },
            
            // Krátké věty
            { cz: "Mám rád angličtinu.", en: "I like English." },
            { cz: "Ona nehraje tenist.", en: "She doesn't play tennis." },
            { cz: "Bydlím v Kladně.", en: "I live in Kladno." },
            { cz: "On má bratra.", en: "He has got a brother." },
            { cz: "Kde je můj penál?", en: "Where is my pencil case?" },
            { cz: "Kolik je hodin?", en: "What time is it?" },
            { cz: "V kolik hodin stáváš?", en: "What time do you get up?" },
            { cz: "Mám rád kočky.", en: "I like cats." },
            { cz: "Ona se dívá na televizi.", en: "She is watching tv." },
            { cz: "My nechodíme do školy v neděli.", en: "We don't go to school on Sunday." }
        ];

        let currentMode = 'mix';
        let currentRound = 1;
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let history = [];

        function startQuiz(mode) {
            currentMode = mode;
            currentIndex = 0;
            score = 0;
            history = [];
            generateQuestions();

            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-results').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            document.getElementById('round-badge').classList.remove('hidden');
            document.getElementById('round-num').innerText = currentRound;

            showQuestion();
        }

        function generateQuestions() {
            // Zamíchat slovíčka a vybrat 10
            let shuffled = [...vocabulary].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            questions = shuffled.map(item => {
                let dir = currentMode;
                if (currentMode === 'mix') {
                    dir = Math.random() > 0.5 ? 'cz-en' : 'en-cz';
                }

                if (dir === 'cz-en') {
                    return { prompt: item.cz, answer: item.en, mode: 'CZ ➔ EN' };
                } else {
                    return { prompt: item.en, answer: item.cz, mode: 'EN ➔ CZ' };
                }
            });
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('q-curr').innerText = currentIndex + 1;
            document.getElementById('q-mode-label').innerText = q.mode;
            document.getElementById('question-text').innerText = q.prompt;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();

            const pct = ((currentIndex + 1) / 10) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function normalizeText(text) {
            return text.trim().toLowerCase()
                .replace(/[.,!?]/g, "")
                .replace(/\s+/g, " ");
        }

        function submitAnswer(e) {
            e.preventDefault();
            const input = document.getElementById('answer-input').value;
            const q = questions[currentIndex];

            const isCorrect = normalizeText(input) === normalizeText(q.answer);

            if (isCorrect) score++;

            history.push({
                prompt: q.prompt,
                userAns: input || "(prázdné)",
                correctAns: q.answer,
                isCorrect: isCorrect
            });

            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-results').classList.remove('hidden');

            const pct = Math.round((score / 10) * 100);
            let grade = 5;
            let title = "Je potřeba ještě procvičovat!";
            let color = "bg-red-600";

            if (pct >= 90) { grade = 1; title = "Výborně! Perfektní znalost!"; color = "bg-emerald-600"; }
            else if (pct >= 75) { grade = 2; title = "Velmi pěkný výsledek!"; color = "bg-blue-600"; }
            else if (pct >= 60) { grade = 3; title = "Dobré, ale máš tam chyby."; color = "bg-yellow-500"; }
            else if (pct >= 45) { grade = 4; title = "Dost chyb, procvič si to znovu."; color = "bg-orange-500"; }

            const badge = document.getElementById('grade-badge');
            badge.innerText = grade;
            badge.className = `w-20 h-20 mx-auto rounded-full text-white flex items-center justify-center text-4xl font-extrabold shadow-lg mb-2 ${color}`;

            document.getElementById('result-title').innerText = title;
            document.getElementById('result-score').innerText = `Správně ${score} z 10 otázek (${pct} %)`;

            // Render Detail
            const detailContainer = document.getElementById('results-detail');
            detailContainer.innerHTML = history.map((item, idx) => `
                <div class="p-2.5 rounded-lg border text-sm ${item.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}">
                    <div class="flex justify-between font-bold text-gray-700">
                        <span>${idx + 1}. ${item.prompt}</span>
                        <span>${item.isCorrect ? '✅' : '❌'}</span>
                    </div>
                    <div class="text-xs mt-1">
                        Tvoje odpověď: <span class="${item.isCorrect ? 'text-emerald-700' : 'text-red-700 font-bold'}">${item.userAns}</span>
                        ${!item.isCorrect ? `<br>Správně: <span class="text-emerald-700 font-bold">${item.correctAns}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function nextRound() {
            currentRound++;
            startQuiz(currentMode);
        }

        function showSetup() {
            currentRound = 1;
            document.getElementById('round-badge').classList.add('hidden');
            document.getElementById('screen-results').classList.add('hidden');
            document.getElementById('screen-setup').classList.remove('hidden');
        }
    </script>
</body>
</html>
