<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Škola pro děti - Procvičování</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ec4b6;
            --danger: #e71d36;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1, h2 { color: #333; margin-bottom: 20px; }
        
        .user-box {
            background: #eef4fb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: 0.2s;
            font-weight: bold;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }

        .hidden { display: none; }

        .option-btn {
            background: #fff;
            border: 2px solid var(--primary);
            color: #333;
            margin: 6px 0;
        }

        .score-board {
            background: #fff3cd;
            border: 1px solid #ffeba2;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }

        .vertical-math {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            text-align: right;
            display: inline-block;
            border-bottom: 3px solid #333;
            padding: 5px 15px;
            margin: 15px 0;
        }

        #feedback {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 25px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- UŽIVATEL A HLAVNÍ MENU -->
    <div id="menu-screen">
        <h1>🎓 Školní Trénink</h1>
        <div class="user-box">
            <label for="username"><strong>Napiš své jméno:</strong></label><br><br>
            <input type="text" id="username" placeholder="Tvoje jméno..." value="Školák">
        </div>

        <h3>Vyber si předmět:</h3>
        <button class="btn" onclick="startQuiz('math')">🔢 Matematika (do 1000)</button>
        <button class="btn" onclick="startQuiz('eng')">🇬🇧 Angličtina (6. třída)</button>
        <button class="btn" onclick="startQuiz('cz')">🇨🇿 Čeština (i/y, e/ě, vyjm. slova)</button>
        <button class="btn" onclick="startQuiz('phy')">⚡ Fyzika (6. třída)</button>

        <div class="score-board">
            <h4>🏆 Nejlepší výsledky (Tabulka skóre):</h4>
            <ol id="leaderboard"></ol>
        </div>
    </div>

    <!-- KVÍZOVÁ OBRAZOVKA -->
    <div id="quiz-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="question-count">Otázka: 1/10</span>
            <span id="score-display">Body: 0</span>
        </div>
        <hr>
        <h2 id="question-title">Otázka</h2>
        
        <div id="vertical-box" class="hidden">
            <div class="vertical-math" id="vertical-content"></div>
        </div>

        <div id="options-box"></div>
        <input type="text" id="text-answer" class="hidden" placeholder="Napiš odpověď...">
        <button id="submit-text-btn" class="btn btn-success hidden" onclick="checkTextAnswer()">Odeslat</button>

        <div id="feedback"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Další otázka ➔</button>
    </div>

    <!-- VYHODNOCENÍ -->
    <div id="result-screen" class="hidden">
        <h2>🎉 Konec testu!</h2>
        <p id="final-stats">Získal jsi 0 bodů z 10.</p>
        <button class="btn btn-success" onclick="saveScoreAndRestart()">Uložit výsledek a pokračovat</button>
        <button class="btn" onclick="showMenu()">Zpět do menu</button>
    </div>

</div>
