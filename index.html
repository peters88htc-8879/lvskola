<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Celoroční Digitální Sešit & Učebnice (Kolech a míchání testů) - Pohádková Akademie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-gradient: radial-gradient(circle at center, #312e81 0%, #1e1b4b 100%);
            --text-color: #1e1b4b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Fredoka', 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 4px 10px rgba(255,255,255,0.9);
            width: 100%;
            max-width: 820px;
            text-align: center;
            border: 6px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .version-badge {
            background: #e0e7ff;
            color: #312e81;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 8px;
            border: 2px solid #c7d2fe;
        }

        h1 {
            color: #312e81;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.1);
        }

        .btn {
            background: linear-gradient(145deg, #818cf8, #4f46e5);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 17px;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.6);
        }

        .btn-success { background: linear-gradient(145deg, #34d399, #059669); }
        .btn-danger { background: linear-gradient(145deg, #f87171, #dc2626); font-size: 15px; padding: 12px; }
        .btn-warning { background: linear-gradient(145deg, #fbbf24, #d97706); font-size: 15px; padding: 12px; color: #fff; }
        .btn-game { background: linear-gradient(145deg, #38bdf8, #0284c7); }
        .btn-theory { background: linear-gradient(145deg, #c084fc, #9333ea); }
        .btn-shared { background: linear-gradient(145deg, #f472b6, #db2777); }

        .class-grid, .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn-class {
            background: linear-gradient(145deg, #4f46e5, #3730a3);
            color: white;
            font-size: 17px;
            border-radius: 20px;
            padding: 15px 10px;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.3);
            flex-direction: column;
            gap: 4px;
        }

        .btn-subject {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border: 3px solid #cbd5e1;
            color: #1e1b4b;
            font-size: 15px;
            border-radius: 22px;
            padding: 14px 10px;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .btn-subject span { font-size: 26px; }

        .hidden { display: none !important; }

        .theory-box {
            background: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 22px;
            border-radius: 22px;
            text-align: left;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .theory-box h3 { color: var(--primary); margin-top: 0; }
        .theory-box h4 { color: #312e81; margin-top: 15px; border-bottom: 2px solid #e0e7ff; padding-bottom: 4px; }
        .theory-box p { line-height: 1.6; color: #334155; font-size: 14px; }
        .theory-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        .theory-table th, .theory-table td { border: 2px solid #cbd5e1; padding: 7px 10px; text-align: left; font-size: 13px; }
        .theory-table th { background: #e0e7ff; color: #312e81; }

        .toc-list {
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .toc-item {
            padding: 10px 14px;
            margin-bottom: 6px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #1e1b4b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toc-item:hover {
            background: #e0f2fe;
            border-color: var(--primary);
        }

        .workbook-container {
            text-align: left;
            max-height: 420px;
            overflow-y: auto;
            padding: 5px;
            margin-bottom: 10px;
        }
        .workbook-item {

            border: 3px solid #cbd5e1;
