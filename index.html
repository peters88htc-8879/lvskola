<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Školní Trénink - Zábavné Učení</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0abfc 0%, #818cf8 50%, #38bdf8 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 560px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 6px solid #ffffff;
        }

        h1 {
            color: #4f46e5;
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #e0e7ff;
        }

        .user-box {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px dashed #0284c7;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 18px;
            border: 3px solid #7dd3fc;
            border-radius: 15px;
            margin-top: 8px;
            text-align: center;
            font-weight: bold;
            outline: none;
            background: #FFFFFF;
            color: #0369a1;
        }

        input[type="text"]:focus {
            border-color: #0284c7;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: all 0.2s ease;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:active { transform: translateY(0); }

        .btn-success { background: linear-gradient(135deg, #34d399 0%, #059669 100%); }
        .btn-danger { background: linear-gradient(135deg, #f87171 0%, #dc2626 100%); font-size: 15px; padding: 10px; border-radius: 14px; }
        .btn-warning { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); font-size: 15px; padding: 10px; border-radius: 14px; }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-subject {
            background: white;
            border: 3px solid #e0e7ff;
            color: #312e81;
            font-size: 16px;
            border-radius: 20px;
            padding: 18px 10px;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .btn-subject span { font-size: 32px; }

        .btn-subject:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            background: #f5f3ff;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.15);
        }

        .hidden { display: none !important; }

        .option-btn {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            color: #1e293b;
            margin: 10px 0;
            font-size: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #eef2ff;
            transform: scale(1.02);
        }

        .score-board {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 3px solid #f59e0b;
            padding: 16px;
            border-radius: 22px;
            margin-top: 15px;
            text-align: left;
            box-shadow: 0 8px 15px rgba(245, 158, 11, 0.15);
        }

        .score-board h4 {
            margin-top: 0;
            color: #b45309;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
        }

        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .score-item {
            background: #FFFFFF;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 8px;
            border: 2px solid #fef08a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
        }

        .score-item:hover {
            background: #e0f2fe;
            transform: scale(1.02);
            border-color: #0284c7;
        }

        .badge-subject {
            background: #4f46e5;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .vertical-math {
            font-family: 'Courier New', Courier, monospace;
            font-size: 38px;
            font-weight: bold;
            text-align: right;
            display: inline-block;
            border-bottom: 4px solid #312e81;
            padding: 10px 25px;
            margin: 10px 0;
            background: #f8fafc;
            border-radius: 16px;
            letter-spacing: 4px;
            color: #1e1b4b;
        }

        #feedback {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
        }

        .question-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #e2e8f0;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 5px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HLAVNÍ MENU -->
    <div id="menu-screen">
        <h1>🌟 Školní Trénink 🌟</h1>
        <div class="user-box">
            <label for="username"><strong>👤 Napiš své jméno nebo vyber v tabulce:</strong></label><br>
            <input type="text" id="username" placeholder="Např. Anička / Honzík...">
        </div>

        <h3>🎯 Vyber si předmět:</h3>
        <div class="subject-grid">
            <button class="btn btn-subject" onclick="startQuiz('math')">
                <span>🔢</span> Matematika
            </button>
            <button class="btn btn-subject" onclick="startQuiz('eng')">
                <span>🇬🇧</span> Angličtina
            </button>
            <button class="btn btn-subject" onclick="startQuiz('cz')">
                <span>🇨🇿</span> Čeština
            </button>
            <button class="btn btn-subject" onclick="startQuiz('phy')">
                <span>⚡</span> Fyzika
            </button>
        </div>

        <div class="score-board">
            <h4>
                <span>🏆 Žebříček (klikni pro detail):</span>
                <button onclick="resetLeaderboard()" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:10px; cursor:pointer; font-size:12px; font-weight:bold;" title="Vymazat skóre">🗑️ Vynulovat</button>
            </h4>
            <ul class="score-list" id="leaderboard"></ul>
        </div>
    </div>

    <!-- KVÍZOVÁ OBRAZOVKA -->
    <div id="quiz-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:16px;">
            <span id="question-count" style="color: #4f46e5;">📌 Otázka: 1/10</span>
            <span id="score-display" style="color: #059669; font-size: 18px;">⭐ Body: 0</span>
        </div>
        <hr style="border: 2px solid #e2e8f0; margin: 12px 0; border-radius: 2px;">

        <div class="question-card">
            <h2 id="question-title" style="margin:0; color:#1e293b; font-size:22px;">Otázka</h2>
            
            <div id="vertical-box" class="hidden">
                <div class="vertical-math" id="vertical-content"></div>
            </div>
        </div>

        <div id="options-box"></div>
        <input type="text" id="text-answer" class="hidden" placeholder="Napiš výsledek...">
        <button id="submit-text-btn" class="btn btn-success hidden" onclick="checkTextAnswer()">✅ Odeslat odpověď</button>

        <div id="feedback"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Další otázka ➔</button>
        
        <button class="btn btn-danger" onclick="confirmExit()">🏠 Ukončit test a zpět do menu</button>
    </div>

    <!-- VYHODNOCENÍ -->
    <div id="result-screen" class="hidden">
        <h2>🎉 Skvělá práce!</h2>
        <div style="font-size: 70px; margin: 10px 0;">🏆</div>
        <p id="final-stats" style="font-size: 20px; font-weight: bold; color: #1e293b;">Získal jsi 0 bodů z 10.</p>
        <button class="btn btn-success" onclick="saveScoreAndRestart()">💾 Uložit výsledek do tabulky</button>
        <button class="btn btn-warning" onclick="showMenu()">🏠 Zpět do menu bez uložení</button>
    </div>

</div>

<!-- DETAILNÍ OKNO PRO HISTORII POKUSŮ -->
<div id="detail-modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modal-title" style="color:#4f46e5; margin-top:0;">📊 Profil hráče</h3>
        <div id="modal-body" style="max-height: 280px; overflow-y: auto; text-align: left; margin: 15px 0; font-size: 15px;"></div>
        <button class="btn btn-success" onclick="selectUserFromModal()">✅ Pokračovat za tohoto hráče</button>
        <button class="btn btn-warning" onclick="closeModal()">Zavřít</button>
    </div>
</div>

<script>
    let currentUser = "";
    let selectedPlayerFromModal = "";
    let currentSubjectKey = "";
    let currentSubjectName = "";
    let questionIndex = 0;
    let score = 0;
    let questions = [];

    const subjectNames = {
        math: "Matematika 🔢",
        eng: "Angličtina 🇬🇧",
        cz: "Čeština 🇨🇿",
        phy: "Fyzika ⚡"
    };

    const database = {
        eng: [
            { q: "🇬🇧 Přelož slovíčko: 'Book'", a: ["kniha", "sešit", "taška", "tužka"], correct: "kniha" },
            { q: "🇬🇧 Doplň sloveso: 'She ___ 12 years old.'", a: ["is", "are", "am", "be"], correct: "is" },
            { q: "🇬🇧 Přelož slovíčko: 'Teacher'", a: ["učitel", "žák", "ředitel", "školník"], correct: "učitel" },
            { q: "🇬🇧 Přelož větu: 'I have a dog.'", a: ["Mám psa.", "Vidím psa.", "Pes spí.", "To je pes."], correct: "Mám psa." },
            { q: "🇬🇧 Doplň zápor: 'They ___ like apples.'", a: ["don't", "doesn't", "isn't", "aren't"], correct: "don't" },
            { q: "🇬🇧 Přelož slovíčko: 'Weather'", a: ["počasí", "voda", "vítr", "slunce"], correct: "počasí" },
            { q: "🇬🇧 Přelož větu: 'Where is my pen?'", a: ["Kde je moje pero?", "Kdo má moje pero?", "Kam jdeš?", "To je moje pero."], correct: "Kde je moje pero?" },
            { q: "🇬🇧 Doplň: 'He usually ___ basketball.'", a: ["plays", "play", "playing", "played"], correct: "plays" },
            { q: "🇬🇧 Přelož slovíčko: 'Always'", a: ["vždy", "nikdy", "často", "občas"], correct: "vždy" },
            { q: "🇬🇧 Přelož větu: 'We live in a house.'", a: ["Bydlíme v domě.", "Stavíme dům.", "Máme velký dům.", "Dům je starý."], correct: "Bydlíme v domě." }
        ],
        cz: [
            { q: "🇨🇿 Doplň i/y: Myš_čka běhá po dvoře.", a: ["i", "y"], correct: "i" },
            { q: "🇨🇿 Doplň vyjmenované slovo: P_cha přchází před pádem.", a: ["ý", "í"], correct: "ý" },
            { q: "🇨🇿 Doplň e/ě: Dělal to pro m_.", a: ["ě", "ě (mě)", "e", "ně"], correct: "ě" },
            { q: "🇨🇿 Doplň i/y: S_kora je užitečný pták.", a: ["y", "i"], correct: "y" },
            { q: "🇨🇿 Doplň e/ě: B_žel rychle do školy.", a: ["ě", "e"], correct: "ě" },
            { q: "🇨🇿 Vyber správně napsané slovo:", a: ["bystrý", "bistrý", "bystrí", "bistrí"], correct: "bystrý" },
            { q: "🇨🇿 Doplň i/y: Děti s_hrály divadlo.", a: ["e", "i", "y"], correct: "e" },
            { q: "🇨🇿 Doplň i/y: B_lit stěnu na bílo.", a: ["í", "ý"], correct: "í" },
            { q: "🇨🇿 Doplň e/ě: Zapom_l na úkol.", a: ["ně", "ě"], correct: "ně" },
            { q: "🇨🇿 Doplň vyjmenované slovo: Litomyš_ je město.", a: ["l", "ľ", "l (Litomyšl)", "š"], correct: "l (Litomyšl)" }
        ],
        phy: [
            { q: "⚖️ Čím měříme hmotnost tělesa?", a: ["Váhami", "Pravítkem", "Teploměrem", "Stopkami"], correct: "Váhami" },
            { q: "📏 Jaká je základní jednotka délky?", a: ["Metr (m)", "Kilogram (kg)", "Sekunda (s)", "Litr (l)"], correct: "Metr (m)" },
            { q: "🚗 Převod jednotek: 1 km má kolik metrů?", a: ["1000 m", "100 m", "10 m", "10000 m"], correct: "1000 m" },
            { q: "💪 Jakou značku má síla ve fyzice?", a: ["F", "m", "v", "s"], correct: "F" },
            { q: "🍏 Jednotkou fyzikální síly je:", a: ["Newton (N)", "Joule (J)", "Pascal (Pa)", "Watt (W)"], correct: "Newton (N)" },
            { q: "⚖️ Převod jednotek: 1 kg má kolik gramů?", a: ["1000 g", "100 g", "10 g", "500 g"], correct: "1000 g" },
            { q: "🧪 Čím měříme objem kapalin?", a: ["Odmerným válcem", "Váhou", "Siloměrem", "Pásmem"], correct: "Odmerným válcem" },
            { q: "🧊 Skupenství vody při 0 °C přechází na:", a: ["Led (pevné)", "Páru (plynné)", "Plazmu", "Žádné z uvedených"], correct: "Led (pevné)" },
            { q: "🌍 Co způsobuje, že padáme k zemi?", a: ["Gravitační síla", "Tlak vzduchu", "Magnetická síla", "Elektrická síla"], correct: "Gravitační síla" },
            { q: "📦 Jaká je značka pro hmotnost?", a: ["m", "H", "kg", "V"], correct: "m" }
        ]
    };

    function generateMathQuestions() {
        let mathQ = [];
        for(let i=0; i<10; i++) {
            let type = Math.floor(Math.random() * 5);
            let n1, n2, ans, text, isVertical = false;

            if (type === 0) {
                n1 = Math.floor(Math.random() * 500) + 50;
                n2 = Math.floor(Math.random() * 400) + 50;
                ans = n1 + n2;
                text = `➕ Spočítej příklad: ${n1} + ${n2}`;
            } else if (type === 1) {
                n1 = Math.floor(Math.random() * 800) + 100;
                n2 = Math.floor(Math.random() * n1);
                ans = n1 - n2;
                text = `➖ Spočítej příklad: ${n1} - ${n2}`;
            } else if (type === 2) {
                n1 = Math.floor(Math.random() * 12) + 2;
                n2 = Math.floor(Math.random() * 20) + 2;
                ans = n1 * n2;
                text = `✖️ Spočítej příklad: ${n1} × ${n2}`;
            } else if (type === 3) {
                n2 = Math.floor(Math.random() * 9) + 2;
                ans = Math.floor(Math.random() * 50) + 2;
                n1 = n2 * ans;
                text = `➗ Spočítej příklad: ${n1} ÷ ${n2}`;
            } else {
                n1 = Math.floor(Math.random() * 400) + 100;
                n2 = Math.floor(Math.random() * 400) + 100;
                ans = n1 + n2;
                text = "📝 Matematika pod sebou:";
                isVertical = true;
            }

            mathQ.push({
                q: text,
                isMath: true,
                isVertical: isVertical,
                v1: n1,
                v2: n2,
                correct: ans.toString()
            });
        }
        return mathQ;
    }

    function startQuiz(subject) {
        let nameInput = document.getElementById("username").value.trim();
        if (!nameInput) {
            alert("⚠️ Prosím, zadej nejprve svoje jméno do políčka nahoře nebo klikni na své jméno v žebříčku dole!");
            return;
        }

        currentUser = nameInput;
        currentSubjectKey = subject;
        currentSubjectName = subjectNames[subject];
        questionIndex = 0;
        score = 0;

        if (subject === 'math') {
            questions = generateMathQuestions();
        } else {
            questions = [...database[subject]].sort(() => Math.random() - 0.5);
        }

        document.getElementById("menu-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        showQuestion();
    }

    function showQuestion() {
        let q = questions[questionIndex];
        document.getElementById("question-count").innerText = `📌 Otázka: ${questionIndex + 1}/10`;
        document.getElementById("score-display").innerText = `⭐ Body: ${score}`;
        document.getElementById("question-title").innerText = q.q;
        document.getElementById("feedback").innerText = "";
        document.getElementById("next-btn").classList.add("hidden");

        const optBox = document.getElementById("options-box");
        const vertBox = document.getElementById("vertical-box");
        const textAns = document.getElementById("text-answer");
        const subBtn = document.getElementById("submit-text-btn");

        optBox.innerHTML = "";
        vertBox.classList.add("hidden");
        textAns.classList.add("hidden");
        subBtn.classList.add("hidden");

        if (q.isMath) {
            if (q.isVertical) {
                vertBox.classList.remove("hidden");
                document.getElementById("vertical-content").innerHTML = `&nbsp;${q.v1}<br>+${q.v2}`;
            }
            textAns.classList.remove("hidden");
            textAns.value = "";
            textAns.focus();
            subBtn.classList.remove("hidden");
        } else {
            let shuffled = [...q.a].sort(() => Math.random() - 0.5);
            shuffled.forEach(opt => {
                let btn = document.createElement("button");
                btn.className = "btn option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkOptionAnswer(opt, q.correct);
                optBox.appendChild(btn);
            });
        }
    }

    function checkOptionAnswer(selected, correct) {
        disableOptions();
        if (selected === correct) {
            score++;
            showFeedback("🎉 Výborně, správně! 🌟", "green");
        } else {
            showFeedback(`❌ Bohužel ne, správně bylo: ${correct}`, "red");
        }
    }

    function checkTextAnswer() {
        let userAns = document.getElementById("text-answer").value.trim();
        let correct = questions[questionIndex].correct;
        
        document.getElementById("submit-text-btn").classList.add("hidden");

        if (userAns === correct) {
            score++;
            showFeedback("🎉 Skvělé, správný výsledek! 🚀", "green");
        } else {
            showFeedback(`❌ Chybička, správně je: ${correct}`, "red");
        }
    }

    function disableOptions() {
        const btns = document.querySelectorAll(".option-btn");
        btns.forEach(b => b.disabled = true);
    }

    function showFeedback(text, color) {
        const fb = document.getElementById("feedback");
        fb.innerText = text;
        fb.style.color = color === "green" ? "var(--success)" : "var(--danger)";
        document.getElementById("score-display").innerText = `⭐ Body: ${score}`;
        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        questionIndex++;
        if (questionIndex < 10) {
            showQuestion();
        } else {
            endQuiz();
        }
    }

    function confirmExit() {
        if (confirm("Opravdu chceš ukončit test? Skóre se tentokrát neuloží.")) {
            showMenu();
        }
    }

    function endQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-stats").innerText = `${currentUser}, v testu [${currentSubjectName}] jsi získal(a) ${score} bodů z 10!`;
    }

    function saveScoreAndRestart() {
        saveLeaderboard(currentUser, score, currentSubjectName);
        showMenu();
    }

    function saveLeaderboard(name, pts, subjectName) {
        let board = JSON.parse(localStorage.getItem("school_leaderboard") || "[]");
        board.push({ 
            name: name, 
            score: pts, 
            subject: subjectName || "Matematika 🔢",
            date: new Date().toLocaleDateString() 
        });
        localStorage.setItem("school_leaderboard", JSON.stringify(board));
    }

    function loadLeaderboard() {
        let board = JSON.parse(localStorage.getItem("school_leaderboard") || "[]");
        let listHtml = "";

        if (board.length === 0) {
            listHtml = "<li style='text-align:center; color:#7F8C8D; padding:10px;'>Zatím žádné výsledky. Napiš jméno a hraj! 🎮</li>";
        } else {
            let uniquePlayers = {};
            board.forEach(item => {
                if (!uniquePlayers[item.name] || item.score > uniquePlayers[item.name].score) {
                    uniquePlayers[item.name] = item;
                }
            });

            let sortedPlayers = Object.values(uniquePlayers).sort((a, b) => b.score - a.score);

            sortedPlayers.forEach((item, index) => {
                let subj = item.subject || "Matematika 🔢";
                listHtml += `
                    <li class="score-item" onclick="showUserDetail('${item.name}')">
                        <div>
                            <strong>#${index+1} 👤 ${item.name}</strong><br>
                            <span class="badge-subject">${subj}</span>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-weight:bold; font-size:16px; color:#059669;">⭐ Max: ${item.score}/10</span><br>
                            <small style="color:#64748b;">${item.date}</small>
                        </div>
                    </li>`;
            });
        }
        document.getElementById("leaderboard").innerHTML = listHtml;
    }

    function showUserDetail(name) {
        selectedPlayerFromModal = name;
        let board = JSON.parse(localStorage.getItem("school_leaderboard") || "[]");
        let userRecords = board.filter(item => item.name === name);
        
        let bySubject = {};
        userRecords.forEach(r => {
            let subj = r.subject || "Matematika 🔢";
            if (!bySubject[subj]) bySubject[subj] = [];
            bySubject[subj].push(r);
        });

        let html = `<strong>Hráč:</strong> ${name}<br><br><strong>📈 Poslední pokusy (pro sledování zlepšení):</strong>`;
        
        for (let subj in bySubject) {
            let lastThree = bySubject[subj].slice(-3);
            html += `<div style="margin-top:10px; background:#f8fafc; padding:8px; border-radius:10px; border:1px solid #cbd5e1;">`;
            html += `<b>${subj}:</b><ul style="padding-left:20px; margin:3px 0;">`;
            lastThree.forEach(r => {
                html += `<li><b>${r.score}/10 bodů</b> <small style="color:#64748b;">(${r.date})</small></li>`;
            });
            html += `</ul></div>`;
        }

        document.getElementById("modal-title").innerText = `📊 Profil hráče: ${name}`;
        document.getElementById("modal-body").innerHTML = html;
        document.getElementById("detail-modal").classList.remove("hidden");
    }

    function selectUserFromModal() {
        document.getElementById("username").value = selectedPlayerFromModal;
        closeModal();
    }

    function closeModal() {
        document.getElementById("detail-modal").classList.add("hidden");
    }

    function resetLeaderboard() {
        if (confirm("Opravdu chceš vymazat celou tabulku skóre?")) {
            localStorage.removeItem("school_leaderboard");
            document.getElementById("username").value = "";
            loadLeaderboard();
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
